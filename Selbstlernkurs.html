<script>
const PASS=4;
const say=(t,l)=>`<div class="say"><b>${l||"So kannst du es sagen"}</b>„${t}“</div>`;
const tbl=(h,rows)=>`<div class="tbl"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

const COURSE=[
{title:"Warum wir das machen",dur:12,
 goals:"Du kannst erklären, was die CHANCENkurve ist, warum wir Diagnostik einsetzen und warum die Ergebnisse für Chancenwerk so wichtig sind.",
 input:`<h3>Was ist die CHANCENkurve?</h3>
 <p>Die CHANCENkurve ist unsere Lernverlaufsdiagnostik in Deutsch und Mathe. Sie basiert auf den Open-Science-Tests von LEVUMI, entwickelt von der TU Dortmund und der LMU München. Im Fokus stehen die Basiskompetenzen Leseverstehen und Grundrechenarten.</p>
 <ul><li>Die Bezugsnorm ist das Kind selbst: Habe ich mich verbessert?</li><li>Es gibt keine Note und keinen Vergleich mit anderen Kindern.</li></ul>
 <h3>Wozu eigentlich Diagnostik?</h3>
 <p>Es geht nicht um Bewertung. Es geht darum, Lernprozesse zu verstehen und gezielt zu planen. Dafür gibt es fünf gute Gründe:</p>
 <ol><li><b>Förderung steuern:</b> Diagnostik und Förderung bilden einen Kreislauf. Wir testen, fördern und testen wieder. So sehen wir, ob unsere Förderung wirkt, und gleichen unser Gefühl zum Lernstand mit echten Daten ab.</li>
 <li><b>Anlass für Gespräche:</b> Die Ergebnisse geben Stoff für Gespräche im Team, mit den Kindern, mit Erziehungsberechtigten und mit Lehrkräften.</li>
 <li><b>Screening:</b> Wir erkennen, wer überhaupt Förderung braucht, auch in höheren Jahrgängen. Dafür braucht es mindestens zwei Tests.</li>
 <li><b>Reporting:</b> Wir machen die Leistungen der geförderten Kinder sichtbar und erfüllen die Erwartungen unserer Stiftungen.</li>
 <li><b>Werbung:</b> Sichtbare Erfolge überzeugen. So profitieren mehr Kinder von besseren Lernförderangeboten.</li></ol>
 <h3>Warum die Daten so wichtig sind</h3>
 <p>Verlässliche Testergebnisse zeigen unseren Stiftungen, was wir bewirken. Das sichert die Finanzierung und damit die Lernförderung an deiner Schule. Fehlen die Ergebnisse, können Stiftungen abspringen. Darum hat die CHANCENkurve in der Lernförderzeit Priorität.</p>`,
 quiz:[
  {type:"single",q:"Was ist die Bezugsnorm der CHANCENkurve?",opts:["Der Durchschnitt der Klasse","Die Note im Zeugnis","Das Kind selbst und seine vorherige Leistung","Die Ergebnisse anderer Schulen"],correct:[2],fb:"Die CHANCENkurve vergleicht ein Kind nur mit sich selbst. Die Frage lautet immer: Habe ich mich verbessert?"},
  {type:"single",q:"Welche Aussage beschreibt das Ziel unserer Diagnostik am besten?",opts:["Wir wollen die Kinder benoten.","Wir wollen Lernprozesse verstehen und die Förderung gezielt planen.","Wir wollen die Kinder einer Klasse miteinander vergleichen.","Wir wollen die Arbeit der Lehrkräfte bewerten."],correct:[1],fb:"Es geht nicht um Bewertung, sondern um Entwicklung und gute Entscheidungen für die Förderung."},
  {type:"match",q:"Ordne die Beschreibungen den fünf Gründen zu.",pairs:[["Wir sehen, ob unsere Fördermaßnahmen wirken.","Förderung steuern"],["Wir sprechen mit Eltern über den Lernstand ihres Kindes.","Anlass für Gespräche"],["Wir erkennen, wer überhaupt Förderung braucht.","Screening"],["Wir zeigen Stiftungen, was die Kinder erreicht haben.","Reporting"],["Mehr Kinder profitieren von guten Lernförderangeboten.","Werbung"]],fb:"Die fünf Gründe zeigen, dass Diagnostik weit mehr ist als ein Test."},
  {type:"single",q:"Was kann passieren, wenn keine verlässlichen Testergebnisse vorliegen?",opts:["Nichts, die Ergebnisse sind nur für die Statistik.","Die Kinder bekommen schlechtere Noten.","Stiftungen können abspringen, und damit fehlt das Geld für die Lernförderung.","Die Schule muss die Tests selbst bezahlen."],correct:[2],fb:"Darum hat die CHANCENkurve in der Lernförderzeit Priorität."},
  {type:"multi",q:"Welche Kompetenzen stehen bei der CHANCENkurve im Fokus?",opts:["Leseverstehen","Rechtschreibung","Grundrechenarten","Geometrie"],correct:[0,2],fb:"Die CHANCENkurve konzentriert sich auf die Basiskompetenzen Leseverstehen und Grundrechenarten."}
 ]},
{title:"Wer, was, wann",dur:12,
 goals:"Du weißt, welche Kinder getestet werden, welche Tests wir einsetzen und in welchem Rhythmus getestet wird.",
 input:`<div class="tiles"><div class="tile">Zielgruppe<b>Klasse 3 bis 6</b></div><div class="tile">Testdauer<b>5 Minuten</b></div><div class="tile">Rhythmus<b>alle 6 bis 8 Wochen</b></div></div>
 <h3>Wer wird getestet?</h3>
 <p>Getestet werden Kinder der Klassen 3 bis 6 mit Förderbedarf in Deutsch oder Mathe. Vermutet ihr auch bei älteren Kindern Förderbedarf, könnt ihr sie ebenfalls testen.</p>
 <h3>Welche Tests setzen wir ein?</h3>
 <ul><li><b>Deutsch:</b> Leseverstehen auf Satzebene, Niveaustufe N4.</li><li><b>Mathe:</b> Subtraktion, Station 3. Das bedeutet Kopfrechnen bis 100 mit einstelligem Subtrahenden und Zehnerübergang.</li></ul>
 <h3>Niveaustufen in Deutsch</h3>
 ${tbl(["Niveaustufe","Passend für"],[["N2","Schuleingangsphase (Klasse 1 bis 2), sobald die Kinder lesen können"],["N4 <span class='tag'>Unser Start</span>","Klasse 3 bis 4"],["N6","Sekundarstufe I, ab Klasse 5"]])}
 <h3>Niveaustufe N3 in Mathe</h3>
 <p>Kopfrechnen und Platzhalteraufgaben im Zahlenraum bis 100, für Klasse 3 bis 6 und auch bei Dyskalkulie geeignet.</p>
 ${tbl(["Rechenart","Stationen"],[["Addition","Station 1 bis 4"],["Subtraktion","Station 1 bis 4 <span class='tag'>Start: Station 3</span>"],["Multiplikation","Station 1 bis 2"],["Division","Station 1 bis 2"]])}
 <h3>Was passiert nach dem Test?</h3>
 <ol><li>Das Kind macht den Test auf der Startstufe.</li><li>Ist die Stufe zu leicht oder zu schwer, wird automatisch hoch oder runter gestuft. Im letzten Jahr hätte das etwa 30 bis 40 Prozent der Kinder betroffen.</li><li>Wir schauen uns das Ergebnis an und leiten passende Förderung ein.</li><li>Wir testen erneut und passen die Förderung bei Bedarf an.</li></ol>
 <h3>Wann wird getestet?</h3>
 <p>In diesem Schuljahr testen wir alle 6 bis 8 Wochen. Den Start legt ihr gemeinsam mit eurer Schulteambegleitung (STB) fest. Je öfter die Kinder testen, desto vertrauter werden Format und Ergebnisse. Wer fehlt, holt den Test verlässlich nach, zum Beispiel beim nächsten Termin in einem anderen Raum.</p>`,
 quiz:[
  {type:"single",q:"Welche Kinder werden standardmäßig mit der CHANCENkurve getestet?",opts:["Alle Kinder der Schule","Kinder der Klassen 3 bis 6 mit Förderbedarf in Deutsch oder Mathe","Nur Kinder der Klasse 5","Nur Kinder mit sehr guten Noten"],correct:[1],fb:"Und wenn ihr bei älteren Kindern Förderbedarf vermutet, dürft ihr sie gern ebenfalls testen."},
  {type:"match",q:"Ordne die Tests dem passenden Inhalt zu.",pairs:[["Deutsch, N4","Leseverstehen auf Satzebene, Klasse 3 bis 4"],["Mathe, Subtraktion Station 3","Kopfrechnen bis 100, Subtrahend einstellig, mit Zehnerübergang"],["Deutsch, N6","Leseverstehen ab Klasse 5"],["Deutsch, N2","Leseverstehen in der Schuleingangsphase"]],fb:"Unsere Startstufen sind Deutsch N4 und Mathe Subtraktion Station 3."},
  {type:"single",q:"Wie lange dauert ein CHANCENkurve-Test pro Kind?",opts:["2 Minuten","5 Minuten","15 Minuten","Eine Schulstunde"],correct:[1],fb:"Der Test ist kurz, darum kommt es auf volle Konzentration an."},
  {type:"single",q:"Was passiert, wenn die Niveaustufe für ein Kind zu leicht oder zu schwer ist?",opts:["Das Kind wird aus der CHANCENkurve genommen.","Die Schulkoordination stuft das Kind per Hand um.","Das Kind wird nach der Testung automatisch hoch oder runter gestuft.","Das Kind bleibt immer auf der Startstufe."],correct:[2],fb:"Die Umstufung läuft automatisch. Für jede Niveaustufe gibt es passendes Fördermaterial."},
  {type:"multi",q:"Welche Aussagen zum Testrhythmus stimmen?",opts:["Wir testen in diesem Schuljahr alle 6 bis 8 Wochen.","Wer an einem Testtermin fehlt, lässt den Test einfach aus.","Den Start legt ihr gemeinsam mit eurer STB fest.","Getestet wird nur einmal pro Schuljahr."],correct:[0,2],fb:"Wer fehlt, holt den Test verlässlich nach, damit die Kurve aussagekräftig bleibt."}
 ]},
{title:"Vorbereitung vor Ort",dur:15,
 goals:"Du kennst die Rollen im Schulteam, weißt, was vor der ersten Testung vorbereitet sein muss, und kennst den Ablauf auf dem CHANCENcampus.",
 input:`<h3>Wer macht was?</h3>
 ${tbl(["Rolle","Aufgabe bei der CHANCENkurve"],[["Schulkoordination","Der organisatorische Motor: plant Termine, organisiert Räume und Aufsicht und behält die Daten im Blick"],["Lernkoordination","Begleitet die Kinder während der Testung eng und unterstützt bei der Aufsicht"],["Jugendliche","Begleiten jeweils ein Kind, ermutigen und achten auf Konzentration"],["Schulteambegleitung","Startet die CHANCENkurve mit euch und ist bei den ersten Testungen dabei"]])}
 <p>Klärt die Aufgabenteilung vor Ort, bevor die erste Testung startet.</p>
 <h3>Gut vorbereitet in die Testung</h3>
 <ul><li><b>Checklisten:</b> Geht die Checklisten aus dem Handout vor dem Start gemeinsam im Team durch. Sie decken Technik, Zeit, Auswahl der Kinder und Förderung ab.</li>
 <li><b>Liste in der geteilten Ablage:</b> alle Kinder mit Jahrgang, Zugangsdaten, Test und Niveau, Terminen und Status. Diese Daten sind vertraulich.</li>
 <li><b>Zugänge:</b> Alle Kinder und das ganze Team haben Zugang zum CHANCENcampus. Passwörter vergebt ihr über den CHANCENraum neu.</li>
 <li><b>Technik mit Plan B:</b> Verlasst euch nicht auf Computerraum oder Schulgeräte. Eigene Geräte und ein Hotspot sichern den Ablauf.</li></ul>
 <h3>Die CHANCENkurve auf dem CHANCENcampus</h3>
 <div class="placeholder"><b>Platzhalter: Screencast, ca. 5 Minuten</b><br>Anmeldung, Test finden, Ablauf mit Malu und Bente („Los geht’s“, „Jetzt starten“), Auswertung im Teacher Dashboard und automatische Umstufung</div>`,

{title:"Die Testsituation gestalten",dur:15,
 goals:"Du weißt, warum die Kinder eng begleitet werden, wie du die Testung startest und begleitest und was bei einem unbrauchbaren Test passiert.",
 input:`<h3>Warum enge Begleitung?</h3>
 <p>Ein Test hat etwas Persönliches, und Kinder reagieren sehr unterschiedlich darauf:</p>
 <ul><li><b>Das Kind traut sich nicht:</b> Es arbeitet zögerlich und zeigt weniger, als es eigentlich kann.</li><li><b>Das Kind klickt sich durch:</b> Es klickt ständig auf „Weiter“, ohne zu lesen. Der Test ist damit unbrauchbar.</li></ul>
 <p>Nur mit enger Begleitung bekommen wir Ergebnisse, die zeigen, was ein Kind wirklich kann.</p>
 <h3>Der Rahmen</h3>
 <ul><li><b>Kleine Gruppen,</b> gern im Rotationssystem. Große Gruppen bringen Unruhe.</li><li><b>Ein ruhiger Raum</b> mit fester Aufsicht.</li><li><b>Die Förderung läuft weiter:</b> Die übrigen Kinder arbeiten normal mit ihren CHANCENheften.</li></ul>
 <div class="tiles"><div class="tile">Übungsleitung, höchstens<b>1 : 3</b></div><div class="tile">Jugendliche, idealerweise<b>1 : 1</b></div></div>
 <p>Wir geben keine Antworten vor. Wir ermutigen, erklären den Ablauf und achten auf Konzentration.</p>
 <h3>So startest du die Testung</h3>
 <ol><li><b>Sinn erklären:</b> Kinder testen verlässlicher, wenn sie verstehen, worum es geht.</li><li><b>Erwartungen klären:</b> Keine Note, kein Wettbewerb. In Ruhe lesen und das Beste geben.</li><li><b>Ablauf zeigen:</b> Test öffnen, Beispiel ansehen, starten.</li></ol>
 ${say("Heute machen wir die CHANCENkurve. Damit sehen wir, was du schon gut kannst und wobei wir dir noch helfen können. Es gibt keine Note. Wichtig ist nur, dass du in Ruhe liest und dein Bestes gibst. Du hast 5 Minuten Zeit.")}

 <ul><li><b>Nah dran sein:</b> Sitz bei den Kindern, nicht am Pult.</li><li><b>Ermutigen, nicht vorsagen.</b></li><li><b>Durchklicken stoppen:</b> Sprich das Kind direkt an.</li><li><b>Nach dem Test:</b> ein kurzes, positives Wort, dann den Status in der Liste eintragen.</li></ul>

// ---------- Zustand ----------
const KEY="ck-kurs-v1";
let S={passed:{},name:""};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const unlocked=i=>i===0||S.passed[i-1]!=null;
const doneCount=()=>Object.keys(S.passed).length;
let view={ch:0,mode:"start",qi:0,answers:[],checked:false};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function renderNav(){
  $("#nav").innerHTML=COURSE.map((c,i)=>{
    const d=S.passed[i]!=null,u=unlocked(i);
    return `<button class="ch ${d?"done":""}" data-ch="${i}" ${u?"":"disabled"} aria-current="${view.mode!=="start"&&view.mode!=="end"&&view.ch===i}">
      <span class="n">${d?"✓":i+1}</span><span><span class="t">${esc(c.title)}</span><br><span class="s">${d?`Bestanden, ${S.passed[i]} von 5`:u?`${c.dur} Minuten`:"Noch gesperrt"}</span></span></button>`;
  }).join("");
  $("#nav").querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>openChapter(+b.dataset.ch));
  const n=doneCount();
  $("#progTxt").textContent=`${n} von ${COURSE.length} Kapiteln`;
  $("#progBar").style.width=(n/COURSE.length*100)+"%";
}
function go(){renderNav();window.scrollTo({top:0});$("#main").focus({preventScroll:true});}

function renderStart(){
  view.mode="start";
  const next=COURSE.findIndex((c,i)=>S.passed[i]==null);
  $("#main").innerHTML=`<section class="panel">
   <div class="eyebrow">Willkommen</div>
   <h2>Fit für die CHANCENkurve in sechs Kapiteln</h2>
   <div class="prose"><p>In diesem Kurs lernst du alles, was du für die Durchführung der CHANCENkurve an deiner Schule brauchst. Jedes Kapitel besteht aus einem kurzen Input und einem Quiz mit fünf Fragen.</p>
   <ul><li>Mit mindestens <b>${PASS} von 5</b> richtigen Antworten schaltest du das nächste Kapitel frei.</li><li>Du kannst jedes Quiz so oft wiederholen, wie du möchtest.</li><li>Dein Fortschritt wird in diesem Browser gespeichert.</li></ul></div>
   <div class="tiles"><div class="tile">Kapitel<b>6</b></div><div class="tile">Fragen<b>30</b></div><div class="tile">Dauer<b>ca. 75 Min.</b></div></div>
   <div class="actions">${next<0?`<button class="btn" id="toEnd">Zur Teilnahmebestätigung</button>`:`<button class="btn" id="go">${doneCount()?"Weiter mit Kapitel "+(next+1):"Kurs starten"}</button>`}
   ${doneCount()?`<button class="btn ghost" id="reset">Fortschritt zurücksetzen</button>`:""}</div></section>`;
  const g=$("#go");if(g)g.onclick=()=>openChapter(next);
  const e=$("#toEnd");if(e)e.onclick=renderEnd;
  const r=$("#reset");if(r)r.onclick=()=>{r.textContent="Wirklich zurücksetzen?";r.onclick=()=>{S={passed:{},name:""};save();renderStart();};};
  go();
}

function openChapter(i){
  if(!unlocked(i))return;
  view={ch:i,mode:"input",qi:0,answers:[],checked:false};
  const c=COURSE[i];
  $("#main").innerHTML=`<section class="panel">
   <div class="eyebrow">Kapitel ${i+1} von ${COURSE.length} · ca. ${c.dur} Minuten</div>
   <h2>${esc(c.title)}</h2>
   <p class="goals"><b>Lernziele:</b> ${esc(c.goals)}</p>
   <div class="prose">${c.input}</div>
   <div class="actions"><button class="btn" id="toQuiz">Zum Quiz: 5 Fragen</button></div></section>`;
  $("#toQuiz").onclick=startQuiz;
  go();
}

function startQuiz(){
  const c=COURSE[view.ch];
  view.mode="quiz";view.qi=0;view.results=[];
  view.prep=c.quiz.map(q=>{
    if(q.type==="single"||q.type==="multi"){const idx=shuffle(q.opts.map((_,k)=>k));return{order:idx,sel:[]};}
    if(q.type==="match"){return{items:shuffle(q.pairs.map((p,k)=>k)),targets:[...new Set(q.pairs.map(p=>p[1]))],place:{},picked:null};}
    if(q.type==="order"){let o=shuffle(q.items.map((_,k)=>k));if(o.every((v,k)=>v===k))o=o.reverse();return{order:o};}
  });
  renderQ();
}

const TYPE={single:"Multiple Choice · eine richtige Antwort",multi:"Multiple Choice · mehrere richtige Antworten",match:"Zuordnung · Drag and Drop",order:"Reihenfolge · Drag and Drop"};
function renderQ(){
  const c=COURSE[view.ch],q=c.quiz[view.qi],p=view.prep[view.qi];
  view.checked=false;
  let body="";
  if(q.type==="single"||q.type==="multi"){
    body=`${q.type==="multi"?`<p class="hint">Wähle ${q.correct.length} Antworten.</p>`:""}<div class="opts">${p.order.map(k=>`<button class="opt ${q.type}" data-k="${k}" aria-pressed="${p.sel.includes(k)}"><span class="box"></span><span>${esc(q.opts[k])}</span></button>`).join("")}</div>`;
  }else if(q.type==="match"){
    body=`<p class="hint">Ziehe jede Karte in das passende Feld. Alternativ: Karte antippen, dann Feld antippen.</p>
     <div class="pool" data-bucket="pool" aria-label="Noch nicht zugeordnet">${p.items.filter(k=>p.place[k]==null).map(k=>chip(q,p,k)).join("")||`<span class="hint" style="margin:0">Alle Karten sind zugeordnet.</span>`}</div>
     <div class="buckets">${p.targets.map((t,ti)=>`<div class="bucket" data-bucket="${ti}" tabindex="0" role="button" aria-label="Feld ${esc(t)}"><h4>${esc(t)}</h4>${p.items.filter(k=>p.place[k]===ti).map(k=>chip(q,p,k)).join("")}</div>`).join("")}</div>`;
  }else{
    body=`<p class="hint">Ziehe die Schritte in die richtige Reihenfolge oder nutze die Pfeile.</p><ol class="orderlist">${p.order.map((k,pos)=>`<li draggable="true" data-pos="${pos}"><span class="pos">${pos+1}</span><span class="txt">${esc(q.items[k])}</span><button class="mini" data-up="${pos}" aria-label="Nach oben" ${pos===0?"disabled":""}>↑</button><button class="mini" data-down="${pos}" aria-label="Nach unten" ${pos===p.order.length-1?"disabled":""}>↓</button></li>`).join("")}</ol>`;
  }
  $("#main").innerHTML=`<section class="panel">
   <div class="qhead"><div class="eyebrow">Quiz Kapitel ${view.ch+1} · Frage ${view.qi+1} von 5</div>
   <div class="dots" aria-hidden="true">${c.quiz.map((_,k)=>`<i class="${k===view.qi?"cur":view.results[k]===true?"r":view.results[k]===false?"w":""}"></i>`).join("")}</div></div>
   <div class="qtype">${TYPE[q.type]}</div>
   <div class="qtext">${esc(q.q)}</div>
   ${body}
   <div id="fb" aria-live="polite"></div>
   <div class="actions"><button class="btn" id="check" ${ready()?"":"disabled"}>Antwort prüfen</button><button class="btn ghost" id="back">Zurück zum Input</button></div></section>`;
  $("#check").onclick=check;
  $("#back").onclick=()=>openChapter(view.ch);
  wire();
}
const chip=(q,p,k)=>`<button class="chip" draggable="true" data-item="${k}" aria-pressed="${p.picked===k}">${esc(q.pairs[k][0])}</button>`;
function ready(){
  const q=COURSE[view.ch].quiz[view.qi],p=view.prep[view.qi];
  if(q.type==="single")return p.sel.length===1;
  if(q.type==="multi")return p.sel.length>0;
  if(q.type==="match")return p.items.every(k=>p.place[k]!=null);
  return true;
}
function wire(){
  const q=COURSE[view.ch].quiz[view.qi],p=view.prep[view.qi];
  if(q.type==="single"||q.type==="multi"){
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(view.checked)return;const k=+b.dataset.k;
      if(q.type==="single")p.sel=[k];else p.sel=p.sel.includes(k)?p.sel.filter(x=>x!==k):[...p.sel,k];
      document.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed",p.sel.includes(+o.dataset.k)));
      $("#check").disabled=!ready();
    });
  }else if(q.type==="match"){
    const place=(k,b)=>{if(view.checked)return;if(b==="pool")delete p.place[k];else p.place[k]=+b;p.picked=null;renderQ();};
    document.querySelectorAll(".chip").forEach(ch=>{
      ch.ondragstart=e=>{e.dataTransfer.setData("text/plain",ch.dataset.item);e.dataTransfer.effectAllowed="move";};
      ch.onclick=e=>{e.stopPropagation();if(view.checked)return;const k=+ch.dataset.item;p.picked=p.picked===k?null:k;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.item===p.picked));};
    });
    document.querySelectorAll("[data-bucket]").forEach(b=>{
      b.ondragover=e=>{e.preventDefault();b.classList.add("over");};
      b.ondragleave=()=>b.classList.remove("over");
      b.ondrop=e=>{e.preventDefault();const k=e.dataTransfer.getData("text/plain");if(k!=="")place(+k,b.dataset.bucket);};
      const act=()=>{if(p.picked!=null)place(p.picked,b.dataset.bucket);};
      b.onclick=act;b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}};
    });
  }else{
    const mv=(a,b)=>{if(view.checked||b<0||b>=p.order.length)return;const o=p.order;[o[a],o[b]]=[o[b],o[a]];renderQ();};
    const moveTo=(a,b)=>{if(view.checked||a===b)return;const o=p.order;const [x]=o.splice(a,1);o.splice(b,0,x);renderQ();};
    document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>mv(+b.dataset.up,+b.dataset.up-1));
    document.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>mv(+b.dataset.down,+b.dataset.down+1));
    document.querySelectorAll(".orderlist li").forEach(li=>{
      li.ondragstart=e=>e.dataTransfer.setData("text/plain",li.dataset.pos);
      li.ondragover=e=>e.preventDefault();
      li.ondrop=e=>{e.preventDefault();moveTo(+e.dataTransfer.getData("text/plain"),+li.dataset.pos);};
    });
  }
}
function check(){
  const q=COURSE[view.ch].quiz[view.qi],p=view.prep[view.qi];
  let ok;
  if(q.type==="single"||q.type==="multi"){
    ok=p.sel.length===q.correct.length&&p.sel.every(k=>q.correct.includes(k));
    document.querySelectorAll(".opt").forEach(o=>{const k=+o.dataset.k;if(q.correct.includes(k))o.classList.add("ok");else if(p.sel.includes(k))o.classList.add("bad");});
  }else if(q.type==="match"){
    ok=true;
    document.querySelectorAll(".chip").forEach(ch=>{const k=+ch.dataset.item;const good=p.targets[p.place[k]]===q.pairs[k][1];ch.classList.add(good?"ok":"bad");if(!good)ok=false;});
  }else{
    ok=p.order.every((k,pos)=>k===pos);
    document.querySelectorAll(".orderlist li").forEach((li,pos)=>li.classList.add(p.order[pos]===pos?"ok":"bad"));
  }
  view.checked=true;view.results[view.qi]=ok;
  let sol="";
  if(!ok){
    if(q.type==="match")sol="<p>Richtig wäre: "+q.pairs.map(x=>`${esc(x[0])} → ${esc(x[1])}`).join("; ")+"</p>";
    if(q.type==="order")sol="<p>Richtige Reihenfolge: "+q.items.map((x,k)=>`${k+1}. ${esc(x)}`).join(" ")+"</p>";
  }
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><strong>${ok?"Richtig!":"Nicht ganz."}</strong><p>${esc(q.fb)}</p>${sol}</div>`;
  const last=view.qi===4;
  const btn=$("#check");btn.disabled=false;btn.textContent=last?"Ergebnis anzeigen":"Nächste Frage";
  btn.onclick=()=>{if(last)renderResult();else{view.qi++;renderQ();}};
  document.querySelectorAll(".mini,.chip").forEach(b=>b.setAttribute("tabindex","-1"));
  btn.focus();
}
function renderResult(){
  const i=view.ch,score=view.results.filter(Boolean).length,pass=score>=PASS;
  if(pass){S.passed[i]=Math.max(score,S.passed[i]||0);save();}
  const last=i===COURSE.length-1;
  $("#main").innerHTML=`<section class="panel result">
   <div class="eyebrow">Ergebnis Kapitel ${i+1}</div>
   <div class="score">${score}<span style="font-size:28px;color:var(--muted)"> / 5</span></div>
   <h2>${pass?(score===5?"Perfekt, alles richtig!":"Bestanden, gut gemacht!"):"Fast geschafft"}</h2>
   <p class="prose" style="margin-inline:auto">${pass?(last?"Du hast alle Kapitel abgeschlossen.":`Kapitel ${i+2} ist jetzt freigeschaltet.`):`Für das nächste Kapitel brauchst du mindestens ${PASS} richtige Antworten. Schau dir den Input noch einmal an und versuch es erneut.`}</p>
   <div class="actions" style="justify-content:center">
   ${pass?(last?`<button class="btn" id="a">Zur Teilnahmebestätigung</button>`:`<button class="btn" id="a">Weiter zu Kapitel ${i+2}</button>`):`<button class="btn" id="a">Quiz wiederholen</button><button class="btn ghost" id="b">Input ansehen</button>`}</div></section>`;
  $("#a").onclick=pass?(last?renderEnd:()=>openChapter(i+1)):startQuiz;
  const b=$("#b");if(b)b.onclick=()=>openChapter(i);
  go();
}
function renderEnd(){
  view.mode="end";
  if(doneCount()<COURSE.length){renderStart();return;}
  const total=Object.values(S.passed).reduce((a,b)=>a+b,0);
  const date=new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"long",year:"numeric"});
  $("#main").innerHTML=`<section class="panel">
   <div class="eyebrow">Geschafft</div><h2>Du bist fit für die CHANCENkurve!</h2>
   <label for="nm" style="font-weight:600;display:block;margin-bottom:6px">Dein Name für die Teilnahmebestätigung</label>
   <input type="text" id="nm" value="${esc(S.name)}" placeholder="Vor- und Nachname">
   <div class="cert"><div class="eyebrow">Teilnahmebestätigung</div>
    <div class="big" id="certName">${esc(S.name)||"Dein Name"}</div>
    <p>hat den Selbstlernkurs <b>Einführung in die CHANCENkurve</b> erfolgreich abgeschlossen.</p>
    <p style="font-variant-numeric:tabular-nums">${total} von 30 Fragen richtig · ${date}</p></div>
   <p class="hint" style="margin-top:14px">Mach einen Screenshot und schick ihn an deine Schulteambegleitung.</p>
   <div class="actions"><button class="btn ghost" id="home">Zur Kursübersicht</button></div></section>`;
  $("#nm").oninput=e=>{S.name=e.target.value;save();$("#certName").textContent=S.name||"Dein Name";};
  $("#home").onclick=renderStart;
  go();
}
renderStart();
</script>

</body></html>
